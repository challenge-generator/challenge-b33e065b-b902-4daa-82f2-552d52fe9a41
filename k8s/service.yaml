apiVersion: v1
kind: Service
metadata:
  name: servicio-svc
  labels:
    app: servicio-transacciones
spec:
  type: ClusterIP
  selector:
    app: servicio-transacciones
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
  publishNotReadyAddresses: false
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-svc-nodeport
  labels:
    app: servicio-transacciones
spec:
  type: NodePort
  selector:
    app: servicio-transacciones
  ports:
  - name: http
    port: 8080
    nodePort: 30080
    targetPort: 8080
    protocol: TCP