version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/banco
      - SPRING_DATASOURCE_USERNAME=banco_user
      - SPRING_DATASOURCE_PASSWORD=banco_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - banco-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=banco
      - POSTGRES_USER=banco_user
      - POSTGRES_PASSWORD=banco_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_user -d banco"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banco-net

networks:
  banco-net:
    driver: bridge

volumes:
  postgres-data: